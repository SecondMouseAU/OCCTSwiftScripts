name: docs-consistency

# Two text-only consistency guards, neither needing a Swift build or a macOS runner.
#
# 1. The OKF policy list stays in step across okf/policies/, okf/index.md and CLAUDE.md.
#    CLAUDE.md deliberately inlines the policies so the always-loaded reference needs no
#    second hop, which makes it a hand-maintained second copy; this stops that copy drifting.
#
# 2. The three BOSL2 bevel gear example scripts keep an identical copied construction core.
#    The duplication is forced: `occtkit run` compiles one Sources/Script/main.swift with
#    ScriptHarness as its only dependency, so an example cannot import a shared gear module.

on:
  push:
    paths:
      - 'okf/**'
      - 'CLAUDE.md'
      - 'Scripts/policy-check.sh'
      - 'Scripts/gear-core-check.sh'
      - 'docs/guides/bosl2-bevel-gears/**'
      - '.github/workflows/docs-consistency.yml'
  pull_request:
    paths:
      - 'okf/**'
      - 'CLAUDE.md'
      - 'Scripts/policy-check.sh'
      - 'Scripts/gear-core-check.sh'
      - 'docs/guides/bosl2-bevel-gears/**'
      - '.github/workflows/docs-consistency.yml'
  workflow_dispatch:

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check policy list consistency
        run: Scripts/policy-check.sh

  gear-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the copied gear core is identical across the examples
        run: Scripts/gear-core-check.sh
