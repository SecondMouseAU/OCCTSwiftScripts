name: verbs

# Asserts the verb inventory stays single-sourced from Registry.all: that
# `occtkit --verbs` is non-empty and well-formed (the Makefile feeds it straight
# into `ln`), and that the canonical per-verb reference and README agree with it.
#
# Deliberately a separate workflow from `integration`, whose recipe step is slow and
# which this one must not wait on. This one must be able to fail the
# build; the drift it guards against (OCCTSwiftScripts#82) shipped a broken
# `make install` precisely because nothing checked it.
#
# macOS-only: the OCCTSwift dependency is a macOS xcframework.

# No `paths:` filter: a required check that a path filter skips never reports, which would block a
# docs-only PR. See tests.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verbs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verbs:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build occtkit
        run: swift build -c release --product occtkit

      - name: Check verb inventory
        env:
          OCCTKIT: .build/release/occtkit
        run: Scripts/verb-check.sh

      # CI always checks out into a directory named after the repo, so it cannot
      # catch the identity mismatch in #98 on its own. This points
      # OCCTKIT_SCRIPTS_PATH at a deliberately renamed symlink instead.
      - name: Check occtkit run package identity
        env:
          OCCTKIT: .build/release/occtkit
        run: Scripts/run-identity-check.sh
